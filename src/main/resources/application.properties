spring.application.name=ai-ops-tool

spring.datasource.url=jdbc:h2:file:./data/aiops;MODE=MySQL;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

ai.model.enabled=${AI_MODEL_ENABLED:false}
ai.model.base-url=${AI_MODEL_BASE_URL:https://api.deepseek.com/}
ai.model.api-key=${AI_MODEL_API_KEY:}
ai.model.model=${AI_MODEL_NAME:deepseek-v4-flash}
ai.model.reasoning-effort=${AI_MODEL_REASONING_EFFORT:medium}
ai.model.store-responses=${AI_MODEL_STORE_RESPONSES:false}
ai.model.allow-insecure-http=${AI_MODEL_ALLOW_INSECURE_HTTP:false}
ai.model.connect-timeout=${AI_MODEL_CONNECT_TIMEOUT:5s}
ai.model.read-timeout=${AI_MODEL_READ_TIMEOUT:120s}
ai.model.max-input-chars=${AI_MODEL_MAX_INPUT_CHARS:20000}

ai.log-upload.max-bytes=${AI_LOG_UPLOAD_MAX_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
